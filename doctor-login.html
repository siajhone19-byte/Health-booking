<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor login | Medical Health Center</title>
  <link rel="stylesheet" href="doctor-login.css">
  <script src="app.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <aside class="auth-aside"><a class="brand" href="index.html"><img src="logo.jpg" alt="Medical Health Center logo"><span class="brand-text"><strong>MEDICAL</strong><span>HEALTH CENTER</span></span></a><p>Medical staff access for reviewing schedules and patient appointments.</p><div class="mini-note">Private access for doctors, nurses, and midwives.</div></aside>
    <section class="form-panel"><div class="eyebrow">Medical staff portal</div><h1>Staff login.</h1><p>Sign in to view your clinic dashboard.</p><form class="form" id="doctor-login-form"><label>Staff email<input type="email" name="email" placeholder="staff@example.com" required></label><label>Password<input type="password" name="password" placeholder="Enter your password" required></label><button type="submit">Log in as staff</button><p class="form-message" id="auth-message" aria-live="polite"></p><div class="form-note">Prototype password: <strong>doctor123</strong></div></form></section>
  </main>
</body>
</html>
